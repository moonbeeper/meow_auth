[package]
name = "meow_auth2"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
argon2 = { version = "0.6.0-rc.7", features = ["rand_core"] }
axum = { version = "0.8.8", features = ["macros"] }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
config = { version = "0.15.22", features = ["toml"] }
dotenvy = "0.15.7"
futures-util = "0.3.32"
hex = "0.4.3"
lettre = { version = "0.11.19", default-features = false, features = [
    "tokio1-rustls-tls",
    "builder",
    "smtp-transport",
    "hostname",
] }
pin-project = "1.1.11"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
smart-default = "0.7.1"
sqlx = { version = "0.8.6", features = [
    "chrono",
    "postgres",
    "runtime-tokio",
    "uuid",
] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = "0.7.18"
toml = "1.0.7"
toml_edit = "0.25.5"
tower = "0.5.3"
tower-cookies = { version = "0.11.0", features = ["private"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
typed-builder = "0.23.2"
ulid = { version = "1.2.1", features = ["serde", "uuid"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "ulid"] }
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
uuid = { version = "1.22.0", features = ["v4"] }
