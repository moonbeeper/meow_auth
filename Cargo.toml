[package]
name = "meow_auth2"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
config = { version = "0.15.19", features = ["toml"] }
serde = { version = "1.0.228", features = ["derive"] }
smart-default = "0.7.1"
tokio = { version = "1.50.0", features = ["full"] }
toml = "1.0.4"
toml_edit = "0.25.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
