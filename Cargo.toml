[package]
name = "meow_auth2"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
argon2 = { version = "0.6.0-rc.7", features = ["rand_core"] }
axum = { version = "0.8.9", features = ["macros"] }
axum-valid = { version = "0.24.0", default-features = false, features = [
    "garde",
    "basic",
] }
base64urlsafedata = "0.5.4"
blake3 = "1.8.4"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
config = { version = "0.15.22", features = ["toml"] }
data-encoding = "2.10.0"
dotenvy = "0.15.7"
futures-util = "0.3.32"
garde = { version = "0.22.1", features = ["derive"] }
hex = "0.4.3"
lettre = { version = "0.11.21", default-features = false, features = [
    "tokio1-rustls-tls",
    "builder",
    "smtp-transport",
    "hostname",
] }
minify-html = "0.18.1"
nanoid = "0.5.0"
nom = "8.0.0"
pin-project = "1.1.11"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.10.1"
rust-embed = { version = "8.11.0", features = ["compression", "include-exclude"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_cbor_2 = "0.13.0"
serde_json = "1.0.149"
smart-default = "0.7.1"
sqlx = { version = "0.8.6", features = [
    "chrono",
    "postgres",
    "runtime-tokio",
    "uuid",
] }
strum = { version = "0.28.0", features = ["derive"] }
tera = "1.20.1"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = "0.7.18"
toml = "1.1.2"
toml_edit = "0.25.11"
totp-rs = { version = "5.7.1", features = ["otpauth"] }
tower = "0.5.3"
tower-cookies = { version = "0.11.0", features = ["private"] }
tower-http = { version = "0.6.8", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
typed-builder = "0.23.2"
ulid = { version = "1.2.1", features = ["serde", "uuid"] }
url = { version = "2.5.8", features = ["serde"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "ulid"] }
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
uuid = { version = "1.23.1", features = ["v4"] }
webauthn-rs = { version = "0.5.4", features = [
    "danger-allow-state-serialisation",
    "danger-credential-internals",
] }
webauthn-rs-proto = "0.5.4"
