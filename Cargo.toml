[package]
name = "meow_auth2"
version = "0.1.1"
edition = "2024"

[profile.dist]
inherits = "release"
lto = "fat"
debug = false
strip = true

[dependencies]
openssl = { version = "0.10", features = ["vendored"] }
anyhow = "1.0.102"
argon2 = { version = "0.6.0-rc.7", features = ["rand_core"] }
axum = { version = "0.8.9", features = ["macros"] }
axum-valid = { version = "0.24.0", default-features = false, features = [
    "validator",
    "basic",
] }
base64urlsafedata = "0.5.5"
blake3 = "1.8.5"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
config = { version = "0.15.24", features = ["toml"] }
data-encoding = "2.11.0"
dotenvy = "0.15.7"
flagset = "0.4.7"
futures-util = "0.3.32"
hex = "0.4.3"
lettre = { version = "0.11.22", default-features = false, features = [
    "tokio1-rustls-tls",
    "builder",
    "smtp-transport",
    "hostname",
] }
minify-html = "0.18.1"
nanoid = "0.5.0"
nom = "8.0.0"
pin-project = "1.1.13"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.10.1"
rust-embed = { version = "8.11.0", features = [
    "compression",
    "include-exclude",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_cbor_2 = "0.13.0"
serde_json = "1.0.150"
sha2 = "0.11.0"
smart-default = "0.7.1"
sqlx = { version = "0.9.0", features = [
    "chrono",
    "postgres",
    "uuid",
    "runtime-tokio",
] }
strum = { version = "0.28.0", features = ["derive", "phf"] }
tera = "1.20.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
toml = "1.1.2"
toml_edit = "0.25.12"
totp-rs = { version = "5.7.1", features = ["otpauth"] }
tower = "0.5.3"
tower-cookies = { version = "0.11.0", features = ["private"] }
tower-http = { version = "0.7.0", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
typed-builder = "0.23.2"
ulid = { version = "1.2.1", features = ["serde", "uuid"] }
url = { version = "2.5.8", features = ["serde"] }
utoipa = { version = "5.5.0", features = [
    "axum_extras",
    "chrono",
    "ulid",
    "uuid",
] }
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
uuid = { version = "1.23.3", features = ["v4"] }
webauthn-rs = { version = "0.5.5", features = [
    "danger-allow-state-serialisation",
    "danger-credential-internals",
] }
webauthn-rs-proto = "0.5.5"
regex = "1.12.4"
hmac = "0.13.0"
validator = { version = "0.20.0", features = ["derive"] }
email_address = "0.2.9"
shadow-rs = { version = "2.0.0", default-features = false }
compact_jwt = "0.5.6"
arc-swap = "1.9.1"

[build-dependencies]
shadow-rs = "2.0.0"
