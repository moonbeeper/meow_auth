# Meow Auth settings :3

[application]
# How long, in seconds, services get to end their work before a forced shutdown
shutdown_timeout_seconds = 120
# Whether the app should force a shutdown after `shutdown_timeout_seconds`
shutdown_timeout_enabled = true
# A 64 char long key used to encrypt and decrypt sensitive data (like TOTP secrets)
# Its autogenerated if left blank. Changing it makes anything encrypted before trash
master_key = "df2f3ba178ecaa9968c042e230661d668e96f73881da2968a525af802d72692c"

[logging]
enabled = true
level = "info"

[http]
bind = "127.0.0.1:8080"
# The URL where this app is reachable. Its used to build absolute URLs (for OAuth), so it has
# to match the reachable URL exactly
origin = "http://localhost:8080/"
# The URL where the frontend is reachable. Its used for setting up CORS and Cookies
frontend = "http://localhost:5173"
# Whether the app is running behind Cloudflare proxy (orange cloud). When its `true`, the app will read
# the following:
# - The connecting user ip from the `CF-Connecting-IP` header instead of the raw addr
# - The connecting user city from the `cf-ipcity` header
# - The connecting user country from the `cf-ipcountry` header
# 
# This requires you to configure Cloudflare to send those headers to the app. By going to your dashboard,
# select your domain > "Rules" > "Settings" > "Managed Transforms" > Enable "Add visitor location headers"
is_under_cloudflare = false

[http.api_docs]
enabled = true
path = "/scalar"

[database]
url = "postgres://meow:meow_pwd@localhost:5432/meow2_development"
min_connections = 1
max_connections = 10

[mailer]
smtp_host = "localhost"
smtp_username = ""
smtp_password = ""
smtp_port = 1025
smtp_secure = false
from_email = "meow@meow.com"
# Whether the app should check on start up and exit if the SMTP connection to the email server fails
# (eg. its unreachable)
test_connection = false

[session]
# The name of the Cookie used to store the session id
cookie_name = "meow_sess"
# The maximum lifetime of a session, in seconds, where it expires no matter if it was used recently
expire_age_seconds = 2592000
# How long, in seconds, a session can last without any activity before being seen as expired
active_expire_age_seconds = 604800
# The threshold time, in seconds, before a session can be renewed
update_threshold_seconds = 600
# How long, in seconds, a session's sudo (sensitive operations) mode can last
sudo_expire_age_seconds = 900

[totp]
issuer = "meow_auth"
digits = 6

[webauthn]
# The naked domain (no scheme or port AND not 127.0.0.1) where Webauthn (Passkey) operations are scoped in.
# For example, if our `rp_origin` is "http://localhost:8080", the `rp_id` should be only "localhost"
rp_id = "localhost"
rp_display_name = "MeowAuth"
# The origin URL (with scheme and port) where Webauthn (Passkey) operations are allowed to be done.
# For example, "http://localhost:8080" is an origin that can be used with the "localhost" `rp_id`
rp_origin = "http://localhost:5173/"
timeout_seconds = 300

[oauth]
# How long, in seconds, the OIDC ID token lasts until expired
oidc_id_token_expire_seconds = 3600
# How long, in seconds, a signing key (JWK) is allowed to be used to sign new JWTs before its retired
# (Retired does not mean deleted, it still exists ONLY for JWT verification purposes)
jwk_active_seconds = 5184000
# How long, in seconds, a retired JWK is still kept, so JWTs signed with it can still be verified, before it's
# deleted
jwk_expired_after_seconds = 7776000
# How often, in seconds, its checked if the JWKs need to be rotated or deleted
jwk_cycle_after_seconds = 43200
