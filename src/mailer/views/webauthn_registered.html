{% extends "partials/base.html" %}

{% block content %}
    {{<ui.heading text={globals.greeting ~ " " ~ user.login ~ "!"} />}}
    {{<ui.spacer px={16} />}}
    {{<ui.text text={"A new passkey (" ~ passkey.name ~ ") was added to your account."} />}}

{% endblock content %}
