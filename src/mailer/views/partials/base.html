<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:v="urn:schemas-microsoft-com:vml"
    xmlns:o="urn:schemas-microsoft-com:office:office"
    lang="en"
>
    <head>
        <title></title>
        <meta charset="UTF-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <!--[if !mso]><!---->
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <!--<![endif]-->
        <meta name="x-apple-disable-message-reformatting" content="" />
        <meta content="target-densitydpi=device-dpi" name="viewport" />
        <meta content="true" name="HandheldFriendly" />
        <meta content="width=device-width" name="viewport" />
        <meta
            name="format-detection"
            content="telephone=no, date=no, address=no, email=no, url=no"
        />
        <style type="text/css">
            table {
                border-collapse: separate;
                table-layout: fixed;
                mso-table-lspace: 0pt;
                mso-table-rspace: 0pt;
            }
            table td {
                border-collapse: collapse;
            }
            body,
            a,
            li,
            p,
            h1,
            h2,
            h3 {
                -ms-text-size-adjust: 100%;
                -webkit-text-size-adjust: 100%;
            }
            html {
                -webkit-text-size-adjust: none !important;
            }
            body {
                min-width: 100%;
                margin: 0px;
                padding: 0px;
            }
            body,
            #innerTable {
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
            #innerTable img + div {
                display: none;
                display: none !important;
            }
            img {
                margin: 0;
                padding: 0;
                -ms-interpolation-mode: bicubic;
            }
            h1,
            h2,
            h3,
            p,
            a {
                overflow-wrap: normal;
                white-space: normal;
                word-break: break-word;
            }
            a {
                text-decoration: none;
            }
            h1,
            h2,
            h3,
            p {
                min-width: 100% !important;
                width: 100% !important;
                max-width: 100% !important;
                display: inline-block !important;
                border: 0;
                padding: 0;
                margin: 0;
            }
            a[x-apple-data-detectors] {
                color: inherit !important;
                text-decoration: none !important;
                font-size: inherit !important;
                font-family: inherit !important;
                font-weight: inherit !important;
                line-height: inherit !important;
            }
            u + #body a {
                color: inherit;
                text-decoration: none;
                font-size: inherit;
                font-family: inherit;
                font-weight: inherit;
                line-height: inherit;
            }
            a[href^="mailto"],
            a[href^="tel"],
            a[href^="sms"] {
                color: inherit;
                text-decoration: none;
            }
        </style>
        <style type="text/css">
            @media (max-width: 480px) {
                .hm {
                    display: none !important;
                }
            }
        </style>
        <style type="text/css">
            @media (max-width: 480px) {
                .t39,
                .t45 {
                    mso-line-height-alt: 0px !important;
                    line-height: 0 !important;
                    display: none !important;
                }
                .t40 {
                    padding: 40px !important;
                    border-radius: 0 !important;
                }
                .t29 {
                    text-align: left !important;
                }
                .t28 {
                    vertical-align: top !important;
                    width: 600px !important;
                }
            }
        </style>
        <!--[if mso]>
            <xml>
                <o:OfficeDocumentSettings>
                    <o:AllowPNG />
                    <o:PixelsPerInch>96</o:PixelsPerInch>
                </o:OfficeDocumentSettings>
            </xml>
        <![endif]-->
    </head>
    <body
        id="body"
        class="t48"
        style="
            min-width: 100%;
            margin: 0px;
            padding: 0px;
            background-color: #ffffff;
        "
    >
        <div class="t47" style="background-color: #ffffff">
            <table
                role="presentation"
                width="100%"
                cellpadding="0"
                cellspacing="0"
                border="0"
                align="center"
            >
                <tr>
                    <td
                        class="t46"
                        style="
                            font-size: 0;
                            line-height: 0;
                            mso-line-height-rule: exactly;
                            background-color: #ffffff;
                        "
                        valign="top"
                        align="center"
                    >
                        <!--[if mso]>
                            <v:background
                                xmlns:v="urn:schemas-microsoft-com:vml"
                                fill="true"
                                stroke="false"
                            >
                                <v:fill color="#FFFFFF" />
                            </v:background>
                        <![endif]-->
                        <table
                            role="presentation"
                            width="100%"
                            cellpadding="0"
                            cellspacing="0"
                            border="0"
                            align="center"
                            id="innerTable"
                        >
                            <tr>
                                <td>
                                    <div
                                        class="t39"
                                        style="
                                            mso-line-height-rule: exactly;
                                            mso-line-height-alt: 50px;
                                            line-height: 50px;
                                            font-size: 1px;
                                            display: block;
                                        "
                                    >
                                        &nbsp;&nbsp;
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="t44" align="center">
                                    <table
                                        class="t43"
                                        role="presentation"
                                        cellpadding="0"
                                        cellspacing="0"
                                        style="
                                            margin-left: auto;
                                            margin-right: auto;
                                        "
                                    >
                                        <tr>
                                            <td
                                                width="600"
                                                class="t42"
                                                style="width: 600px"
                                            >
                                                <table
                                                    class="t41"
                                                    role="presentation"
                                                    cellpadding="0"
                                                    cellspacing="0"
                                                    width="100%"
                                                    style="width: 100%"
                                                >
                                                    <tr>
                                                        <td
                                                            class="t40"
                                                            style="
                                                                border: 1px
                                                                    dashed
                                                                    #ebebeb;
                                                                overflow: hidden;
                                                                background-color: #ffffff;
                                                                padding: 44px
                                                                    42px 32px
                                                                    42px;
                                                                border-radius: 5px
                                                                    5px 5px 5px;
                                                            "
                                                        >
                                                            <table
                                                                role="presentation"
                                                                width="100%"
                                                                cellpadding="0"
                                                                cellspacing="0"
                                                                style="
                                                                    width: 100% !important;
                                                                "
                                                            >
                                                                {% block content %}{% endblock content %}
                                                            </table>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <div
                                        class="t45"
                                        style="
                                            mso-line-height-rule: exactly;
                                            mso-line-height-alt: 50px;
                                            line-height: 50px;
                                            font-size: 1px;
                                            display: block;
                                        "
                                    >
                                        &nbsp;&nbsp;
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </div>
        <div
            class="gmail-fix"
            style="
                display: none;
                white-space: nowrap;
                font: 15px courier;
                line-height: 0;
            "
        >
            &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
            &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
            &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
            &nbsp; &nbsp; &nbsp;
        </div>
    </body>
</html>
